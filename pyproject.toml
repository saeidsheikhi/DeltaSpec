[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "effectgate-research"
version = "0.0.1"
description = "Research scaffold for self-validating effect contracts and stateful agent release testing."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "urllib3>=2.0",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "jsonschema>=4.21",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "pandas>=2.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
]

[project.scripts]
effectgate = "effectgate.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
